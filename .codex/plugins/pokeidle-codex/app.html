<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PokeIdle</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: #0f0f12; color: #f5f5f5; font: 14px system-ui, sans-serif; }
    main { display: flex; flex-direction: column; height: 100%; min-height: 420px; }
    iframe { flex: 1; width: 100%; min-height: 380px; border: 0; background: #0f0f12; }
    #connection { padding: 12px 16px; background: #1c1c21; }
    #connection[hidden] { display: none; }
    button { margin-left: 10px; padding: 6px 12px; border: 1px solid #606070; border-radius: 6px; background: #303038; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div id="connection" role="status"><span id="status">Connexion à PokeIdle…</span><button id="retry" type="button">Réessayer</button></div>
    <iframe id="game" title="PokeIdle"></iframe>
  </main>
  <script>
    const frame = document.getElementById('game');
    const connection = document.getElementById('connection');
    const status = document.getElementById('status');
    const retryButton = document.getElementById('retry');
    const startupError = __STARTUP_ERROR__;
    let ready = false;
    let attempt = 0;
    let loadTimeout;
    let rpcId = 0;
    const pending = new Map();

    function rpcRequest(method, params) {
      return new Promise((resolve, reject) => {
        const id = `pokeidle-${++rpcId}`;
        const timeout = setTimeout(() => {
          pending.delete(id);
          reject(new Error('Codex ne répond pas à la demande de connexion.'));
        }, 10000);
        pending.set(id, { resolve, reject, timeout });
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      });
    }

    window.addEventListener('message', (event) => {
      if (event.source === frame.contentWindow && event.data?.type === 'pokeidle-ready') {
        ready = true;
        clearTimeout(loadTimeout);
        connection.hidden = true;
        return;
      }
      if (event.source !== window.parent || event.data?.jsonrpc !== '2.0') return;
      const message = event.data;
      const request = pending.get(message.id);
      if (request) {
        clearTimeout(request.timeout);
        pending.delete(message.id);
        if (message.error) request.reject(new Error(message.error.message));
        else request.resolve(message.result);
      }
      if (message.method === 'ui/notifications/tool-result' && message.params?.structuredContent?.ready && !ready) loadGame();
    });

    const bridgeReady = rpcRequest('ui/initialize', {
      appInfo: { name: 'pokeidle', version: '1.0.6' },
      appCapabilities: {},
      protocolVersion: '2026-01-26'
    }).then(() => {
      window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} }, '*');
    });
    bridgeReady.catch((error) => console.error('PokeIdle : connexion à Codex impossible.', error));

    function loadGame() {
      clearTimeout(loadTimeout);
      ready = false;
      connection.hidden = false;
      status.textContent = 'Connexion à PokeIdle…';
      frame.src = 'http://127.0.0.1:4173/?codex-view=1.0.6&attempt=' + (++attempt);
      loadTimeout = setTimeout(() => {
        if (!ready) status.textContent = 'Le jeu ne s’affiche pas. Clique sur Réessayer pour rétablir la connexion.';
      }, 12000);
    }

    retryButton.addEventListener('click', async () => {
      retryButton.disabled = true;
      status.textContent = 'Reconnexion à PokeIdle…';
      try {
        await bridgeReady;
        const response = await rpcRequest('tools/call', { name: 'open_pokeidle', arguments: {} });
        if (response.isError) throw new Error(response.content?.[0]?.text || 'Le serveur ne peut pas démarrer.');
        loadGame();
      } catch (error) { status.textContent = error.message; }
      finally { retryButton.disabled = false; }
    });

    if (startupError) status.textContent = 'PokeIdle ne peut pas démarrer : ' + startupError;
    else loadGame();
  </script>
</body>
</html>
